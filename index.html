<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#120d33">
  <meta name="description" content="Карта дня, ответ «да или нет», гороскоп на сегодня и совместимость знаков зодиака.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Гадания и гороскоп">
  <meta property="og:description" content="Карта дня, ответ «да или нет», гороскоп на сегодня для всех 12 знаков и совместимость пар. Загляните, что приготовил вам этот день.">
  <meta property="og:locale" content="ru_RU">
  <title>Гадания и гороскоп</title>
  <!-- Заставка: видна сразу, пока грузится Bridge (380 КБ) — всё в этом файле, без загрузок. -->
  <style>
    html, body { margin: 0; background: #0d0a2b; }
    #splash { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      color: #fff8e8; font: 19px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; text-align: center;
      background: radial-gradient(1.5px 1.5px at 12% 18%, #fff6dc 50%, transparent 51%), radial-gradient(1px 1px at 78% 12%, #fff6dc 50%, transparent 51%),
        radial-gradient(1.5px 1.5px at 64% 34%, #fff6dc 50%, transparent 51%), radial-gradient(1px 1px at 22% 62%, #fff6dc 50%, transparent 51%),
        radial-gradient(1.5px 1.5px at 86% 70%, #fff6dc 50%, transparent 51%), radial-gradient(1px 1px at 40% 86%, #fff6dc 50%, transparent 51%),
        radial-gradient(ellipse 80% 50% at 80% 0%, rgba(120, 80, 220, .35), transparent 70%),
        linear-gradient(180deg, #0d0a2b 0%, #1b1450 55%, #2b1d66 100%); }
    #splash .s-moon { width: 64px; height: 64px; border-radius: 50%; box-shadow: inset -16px 6px 0 0 #f3cf73; transform: rotate(-20deg); filter: drop-shadow(0 0 14px rgba(255, 220, 140, .5)); }
    #splash .s-title { margin: 0; font: 700 34px/1.2 Georgia, "Times New Roman", "DejaVu Serif", serif; color: #f3cf73; }
    #splash .s-wait { margin: 0; font-size: 20px; color: #efe4c8; }
    #splash[hidden] { display: none; }
  </style>
  <noscript><style>#splash { display: none; }</style></noscript>
</head>
<body>
  <div id="splash" aria-live="polite">
    <div class="s-moon" aria-hidden="true"></div>
    <p class="s-title">Гадания и гороскоп</p>
    <p class="s-wait">Открываем…</p>
  </div>
  <link rel="stylesheet" href="style.css">
  <!-- Playgama Bridge: первым скриптом страницы, обычной загрузкой (не async, не defer — так требует Bridge),
       сразу после заставки, чтобы заставка была видна, пока он грузится. Локальная копия 2.4.1. -->
  <script src="playgama-bridge.js"></script>
  <div id="sky" aria-hidden="true"></div>
  <main id="app" class="app">
    <noscript>
      <p class="noscript">Чтобы открыть гадания, включите JavaScript в настройках браузера.</p>
    </noscript>
  </main>
  <div id="adwait" class="adwait" role="status" aria-live="polite" hidden>
    <div class="adwait-box"><span class="spinner" aria-hidden="true"></span>Загружаем рекламу…</div>
  </div>

  <script src="config.js"></script>
  <script src="platform.js"></script>
  <script src="analytics.js"></script>
  <script src="share.js"></script>
  <script src="content/tarot.js"></script>
  <script src="content/yesno.js"></script>
  <script src="content/zodiac.js"></script>
  <script src="content/horoscope.js"></script>
  <script src="content/compat.js"></script>
  <script src="art.js"></script>
  <script src="postcards.js"></script>
  <script src="app.js"></script>
</body>
</html>
